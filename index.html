<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Rock Paper Scissors</h1>
        <div class="scoreboard">
            <p>Player: <span id="playerScore">0</span></p>
            <p>Computer: <span id="computerScore">0</span> </p>
        </div>
        <div id="choicebtn">
            <button class="choices" id="rock">ROCK</button>
            <button class="choices" id="paper">PAPER</button>
            <button class="choices id="scissors">SCISSORS</button>
        </div>
        <div class="results">
            <p>Player Chose: <span id="playerChoiceDisplay"></span></p>
            <p>Computer Chose: <span id="computerChoiceDisplay"></span></p>
            <p>Results: <span id="gameResult"></span></p>
        </div>
    </div>
    <script src='script.js'></script>
</body>
</html>
